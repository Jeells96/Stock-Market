name: Autonomous Investment Advisor

# Fires by itself — no browser, no human. The real work is the post-close run:
# it marks the just-completed session, applies stops/targets, and enters picks
# at that day's close — committed while tomorrow's outcome is still unknown,
# which is what makes the record verifiable.
#
# Timing note: on GitHub's shared runner IPs, Yahoo and Stooq are permanently
# rate-limited, so the only working data source is Finnhub's end-of-day close —
# which is ONLY available AFTER the 4pm ET close (it refuses to pass a live
# mid-session price off as a close). So a run can only advance the record when
# it fires post-close (after ~21:10 UTC). GitHub's scheduler also delays cron by
# anywhere from minutes to hours and sometimes skips a slot, so we fire several
# times across the post-close evening: whichever run actually lands after the
# close does the work, and the rest find the record already current and exit
# cleanly (no email — a no-data pass is routine, never a failure). The early
# pre-open slot is a harmless catch-up that never opens positions.
#
# NOTE: GitHub only fires scheduled workflows from the DEFAULT branch — merge
# this to main to activate. GitHub also auto-disables schedules after 60 days
# without repo activity, but the advisor's own daily commits keep it alive.

on:
  schedule:
    - cron: "40 10 * * 1-5"   # ~pre-open catch-up (replays, never opens)
    - cron: "45 21 * * 1-5"   # post-close, primary trading run (5:45pm ET)
    - cron: "40 22 * * 1-5"   # post-close retry #2 (6:40pm ET)
    - cron: "40 0 * * 2-6"    # post-close retry #3, after midnight UTC (7:40pm ET)
  workflow_dispatch:

permissions:
  contents: write

# Shared with the Sunday tuner only (their schedules can never collide). The
# intraday Day Trader keeps its OWN group: GitHub holds just one pending run
# per group and cancels the rest, so the quick 20-minute checks must not wait
# in line behind this 15–30-minute run.
concurrency:
  group: advisor-daily
  cancel-in-progress: false

jobs:
  advise:
    runs-on: ubuntu-latest
    # Floor mode quotes the whole universe one symbol/second under Finnhub's free
    # 60/min cap, so a full post-close run needs comfortably more than 35 minutes
    # or GitHub kills it mid-way and the record never advances.
    timeout-minutes: 50
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Pre-flight — engine money-math self-test (offline, synthetic data)
        run: python scripts/test_advisor.py

      - name: Run advisor engine
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python scripts/advisor.py

      - name: Commit and push results
        run: |
          git config user.name "advisor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data REPORT.md README.md
          if git diff --cached --quiet; then
            echo "No changes to commit (market closed or nothing new)."
            exit 0
          fi
          if [ -f data/commit_msg.txt ]; then
            git commit -F data/commit_msg.txt
          else
            git commit -m "chore: advisor run $(date -u +%Y-%m-%dT%H:%MZ)"
          fi
          # retry push in case of a concurrent update (|| true keeps bash -e
          # from killing the loop on a transient pull failure)
          for i in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase || git rebase --abort || true
            sleep 5
          done
          git push
