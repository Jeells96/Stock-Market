name: Autonomous Investment Advisor

# Fires by itself — no browser, no human:
#   • 21:45 UTC weekdays  → THE trading run (5:45pm EDT / 4:45pm EST): marks
#     outcomes on the just-completed session, applies stops/targets, and enters
#     new picks at that day's closing price — committed while tomorrow's
#     outcome is still unknown, which is what makes the record verifiable.
#   • 13:10 UTC weekdays  → catch-up run (9:10am EDT / 8:10am EST): replays any
#     sessions a failed evening run missed. Never opens new positions (the
#     engine refuses to trade at a stale close), so a late cron firing during
#     market hours is harmless.
# Manual runs are available from the Actions tab via "Run workflow".
#
# NOTE: GitHub only fires scheduled workflows from the DEFAULT branch — merge
# this to main to activate. GitHub also auto-disables schedules after 60 days
# without repo activity, but the advisor's own daily commits keep it alive.

on:
  schedule:
    - cron: "10 13 * * 1-5"
    - cron: "45 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: advisor
  cancel-in-progress: false

jobs:
  advise:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Pre-flight — engine money-math self-test (offline, synthetic data)
        run: python scripts/test_advisor.py

      - name: Run advisor engine
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python scripts/advisor.py

      - name: Commit and push results
        run: |
          git config user.name "advisor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data REPORT.md README.md
          if git diff --cached --quiet; then
            echo "No changes to commit (market closed or nothing new)."
            exit 0
          fi
          if [ -f data/commit_msg.txt ]; then
            git commit -F data/commit_msg.txt
          else
            git commit -m "chore: advisor run $(date -u +%Y-%m-%dT%H:%MZ)"
          fi
          # retry push in case of a concurrent update (|| true keeps bash -e
          # from killing the loop on a transient pull failure)
          for i in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase || true
            sleep 5
          done
          git push
