<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1.0" />
<title>Jaren's Stock Market Adviser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="description" content="Four automatic strategies invest pretend money and tell you exactly what to do — with a public, tamper-proof track record." />
<meta name="theme-color" content="#0a1628" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%230f1f3d%22/><path d=%22M18 72 L38 56 L50 62 L82 30%22 stroke=%22%23e6c878%22 stroke-width=%229%22 fill=%22none%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/><path d=%22M84 28 L84 46 L66 28 Z%22 fill=%22%23e6c878%22/></svg>" />
<style>
  /* ============ Four tabs, old navy-and-gold soul ============ */
  :root{
    --navy-deep:#0a1628; --navy:#0f1f3d; --navy-mid:#162b52;
    --gold:#c9a961; --gold-bright:#e6c878; --gold-dim:#8a7340;
    --ivory:#f4ead5; --cream:#e8dcc0;
    --up:#4ade80; --down:#f87171;
    --line:rgba(201,169,97,0.25); --line-strong:rgba(201,169,97,0.55);
    --card:rgba(15,31,61,0.65);
    /* strategy accents — validated for this surface */
    --day:#c026d3; --fast:#ea580c; --steady:#16a34a; --nest:#0284c7;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{background:var(--navy-deep)}
  body{
    font-family:'JetBrains Mono',monospace;
    font-size:15px; line-height:1.8; color:var(--ivory);
    max-width:860px; margin:0 auto; padding:0 16px 60px;
    background-image:
      radial-gradient(ellipse at top, rgba(201,169,97,0.08), transparent 50%),
      radial-gradient(ellipse at bottom, rgba(31,58,102,0.5), transparent 60%),
      linear-gradient(180deg,#08111f 0%,#0a1628 100%);
    background-attachment:fixed;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence baseFrequency='0.85' numOctaves='2'/></filter><rect width='200' height='200' filter='url(%23n)' opacity='0.04'/></svg>");
    mix-blend-mode:overlay;
  }
  h1{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:clamp(30px,6vw,42px);line-height:1.15;text-align:center;margin:22px 0 6px;position:relative;z-index:2}
  .subtitle{text-align:center;color:var(--gold-dim);font-size:13px;margin-bottom:6px;position:relative;z-index:2}
  .statusline{text-align:center;color:var(--cream);font-size:13px;font-style:italic;margin-bottom:22px;position:relative;z-index:2}
  b{color:#fff}
  .up{color:var(--up);font-weight:bold}
  .down{color:var(--down);font-weight:bold}

  /* ---- live ticker ---- */
  .ticker-bar{position:sticky;top:0;z-index:50;margin:0 -16px;background:linear-gradient(180deg,#06101e,#0a1628);border-bottom:1px solid var(--line-strong);overflow:hidden;height:42px;display:flex;align-items:center;box-shadow:0 4px 20px rgba(0,0,0,0.5)}
  .ticker-label{flex-shrink:0;padding:0 14px;height:100%;display:flex;align-items:center;background:linear-gradient(90deg,var(--gold-dim),transparent);border-right:1px solid var(--line);font-family:'Cormorant Garamond',serif;font-weight:700;font-size:14px;color:#08111f;letter-spacing:.18em;text-transform:uppercase}
  .ticker-label .dot{width:6px;height:6px;border-radius:50%;background:#dc2626;margin-right:8px;box-shadow:0 0 8px #dc2626;animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .ticker-track{display:flex;animation:scroll 90s linear infinite;flex-shrink:0;will-change:transform}
  .ticker-track:hover{animation-play-state:paused}
  @keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .ticker-item{display:inline-flex;align-items:center;gap:8px;padding:0 18px;font-size:12px;white-space:nowrap;border-right:1px solid rgba(201,169,97,0.08)}
  .ticker-sym{color:var(--gold-bright);font-weight:600}
  .ticker-px{color:var(--ivory)}
  .ticker-chg.up,.ticker-chg.down{font-weight:500}

  /* ---- the four tabs ---- */
  .tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px;position:relative;z-index:2}
  .tabbtn{
    font-family:inherit;cursor:pointer;background:var(--card);color:var(--ivory);
    border:2px solid var(--line);border-radius:6px;padding:14px 6px 12px;
    text-align:center;transition:transform .1s;
  }
  .tabbtn:hover{transform:translateY(-1px);border-color:var(--gold)}
  .tabbtn .icon{font-size:28px;display:block;line-height:1.2}
  .tabbtn .name{font-family:'Cormorant Garamond',serif;font-size:19px;font-weight:700;display:block;margin-top:2px}
  .tabbtn .val{font-size:12px;color:var(--gold-dim);display:block;margin-top:2px}
  .tabbtn.active{border-color:var(--accent);box-shadow:0 0 14px color-mix(in srgb, var(--accent) 35%, transparent)}
  .tabbtn.active .name{color:var(--gold-bright)}
  .tabbtn[data-tab="daytrade"]{--accent:var(--day)}
  .tabbtn[data-tab="aggressive"]{--accent:var(--fast)}
  .tabbtn[data-tab="growth"]{--accent:var(--steady)}
  .tabbtn[data-tab="longterm"]{--accent:var(--nest)}

  .leader{position:absolute;top:-10px;right:-6px;font-size:16px;filter:drop-shadow(0 0 4px rgba(0,0,0,0.6))}
  .tabbtn{position:relative}
  .combined{text-align:center;font-size:13px;color:var(--cream);margin:-8px 0 18px;position:relative;z-index:2}
  .combined b{color:#fff}
  .stale{background:rgba(220,38,38,0.12);border:1px solid var(--down);border-radius:8px;color:var(--ivory);
    padding:12px 16px;margin-bottom:18px;font-size:13px;position:relative;z-index:2}
  @media (prefers-reduced-motion: reduce){
    .ticker-track{animation:none}
    .alertcard{animation:none}
    .ticker-label .dot{animation:none}
  }

  /* ---- cards ---- */
  .card{background:linear-gradient(180deg,rgba(22,43,82,0.7),rgba(15,31,61,0.7));border:1px solid var(--line);border-radius:8px;
        padding:24px 26px;margin-bottom:20px;position:relative;z-index:2}
  .card h2{font-family:'Cormorant Garamond',serif;font-size:27px;font-weight:700;color:var(--gold-bright);margin-bottom:12px}
  .card p{margin-bottom:12px}
  .card p:last-child{margin-bottom:0}
  .todo{border-left:5px solid var(--gold)}
  .todo.has-buy{border-left-color:var(--up)}
  .todo.has-sell{border-left-color:var(--down)}
  .alertcard{border:2px solid var(--down);background:rgba(220,38,38,0.12);animation:glowStop 2s ease-in-out infinite}
  .alertcard h2{color:var(--down)}
  @keyframes glowStop{0%,100%{background:rgba(220,38,38,0.09)}50%{background:rgba(220,38,38,0.18)}}
  .bignum{font-family:'Cormorant Garamond',serif;font-size:clamp(38px,8vw,50px);font-weight:700;line-height:1.15;margin:6px 0 10px;color:#fff}
  .bignum .chg{font-size:22px;font-family:'JetBrains Mono',monospace}
  .hold{padding:13px 0;border-top:1px solid var(--line)}
  .hold:first-of-type{border-top:none}
  .hold p{margin:0}
  .trade{padding:10px 0;border-top:1px solid var(--line);font-size:13px;color:var(--cream)}
  .trade:first-of-type{border-top:none}
  .smallnote{font-size:12px;color:var(--gold-dim)}
  a{color:var(--gold-bright)}

  /* ---- the stock board: a grid of cards, three across at every size ---- */
  .bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px;align-items:start}
  .bcard{position:relative;display:flex;flex-direction:column;gap:7px;padding:13px 13px 12px;
    border:1px solid var(--line);border-radius:8px;background:rgba(8,17,31,0.45)}
  .bcard[data-card]{cursor:pointer}
  .bcard[data-card]:hover{border-color:var(--line-strong)}
  .bcard.buy{background:rgba(74,222,128,0.10);border-color:rgba(74,222,128,0.55);
    box-shadow:0 0 12px rgba(74,222,128,0.12)}
  .bcard.sell{background:rgba(220,38,38,0.13);border-color:var(--down);
    box-shadow:0 0 12px rgba(220,38,38,0.16)}
  .brank{position:absolute;top:9px;right:11px;font-size:11px;color:var(--gold-dim)}
  .bsym{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;color:#fff;display:block;line-height:1.1}
  .bpx{font-size:13px;color:var(--ivory)}
  .bstamp{display:block;font-size:10px;color:var(--gold-dim)}
  .bstamp.live{color:var(--up)}
  .bnums{font-size:12px;color:var(--cream);line-height:1.5}
  .bnums b{color:#fff}
  .breason{font-size:11px;color:var(--gold-dim);line-height:1.4}
  .bwhy{font-size:11px;color:var(--cream);line-height:1.4}
  .bside{display:flex;flex-direction:column;align-items:flex-start;gap:6px;margin-top:auto}
  .bpnl{display:block;font-family:'JetBrains Mono',monospace;font-size:19px;font-weight:700;margin:2px 0}
  .taphint{font-size:9.5px;color:var(--gold-dim);letter-spacing:.06em;text-transform:uppercase;
    margin-top:2px;text-align:center}
  .bdetail{border-top:1px solid var(--line);padding-top:8px;font-size:11.5px;line-height:1.5;
    color:var(--cream);cursor:default}
  .bdetail p{margin:0 0 7px}
  .bdetail b{color:#fff}
  .newslist{list-style:none;margin:0 0 7px;padding:0}
  .newslist li{margin:0 0 4px;font-size:11px;line-height:1.4}
  .newslist .nup{color:var(--up)} .newslist .ndown{color:var(--down)}
  .newslist .nsrc{color:var(--gold-dim);font-size:10px}
  .bignum.up{color:var(--up)} .bignum.down{color:var(--down)}
  /* phones: keep three across, shrink everything */
  @media(max-width:700px){
    .bgrid{gap:6px}
    .bcard{padding:8px 8px 7px;gap:5px;border-radius:6px}
    .bsym{font-size:15px}
    .bpx{font-size:11px}
    .bstamp{font-size:8.5px}
    .bnums{font-size:9.5px;line-height:1.45}
    .breason,.bwhy{font-size:9.5px}
    .brank{font-size:9px;top:6px;right:8px}
    .chip{font-size:8.5px;padding:3px 6px;letter-spacing:.06em}
    .ibought{font-size:10px;padding:5px 8px}
    .btn2{font-size:10.5px;padding:6px 9px}
    .bpnl{font-size:15px}
    .bdetail{font-size:10.5px}
    .taphint{font-size:8px}
    .buyform label{font-size:11px}
    .buyform input{width:100%;max-width:120px;font-size:12px;padding:5px 7px}
  }
  .chip{font-size:11px;font-weight:700;letter-spacing:.1em;padding:4px 10px;border-radius:3px;text-transform:uppercase}
  .chip.cbuy{background:var(--up);color:#06220f}
  .chip.csell{background:var(--down);color:#fff}
  .chip.cheld{background:rgba(201,169,97,0.2);color:var(--gold-bright);border:1px solid var(--gold-dim)}
  .chip.cmine{background:rgba(56,189,248,0.18);color:#7dd3fc;border:1px solid #0284c7}
  .chip.cgap{background:rgba(74,222,128,0.15);color:var(--up);border:1px solid rgba(74,222,128,0.5)}
  .ibought{font-family:inherit;cursor:pointer;font-size:12px;font-weight:700;color:#06220f;background:var(--up);
    border:none;border-radius:4px;padding:7px 12px}
  .ibought:hover{filter:brightness(1.1)}
  .buyform{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:8px 0 2px;font-size:13px}
  .buyform label{color:var(--cream)}
  .buyform input{font-family:inherit;font-size:14px;width:110px;padding:7px 9px;background:rgba(8,17,31,0.7);
    border:1px solid var(--line-strong);border-radius:4px;color:#fff}
  .btn2{font-family:inherit;cursor:pointer;font-size:13px;font-weight:700;padding:8px 14px;border-radius:4px;border:none}
  .btn2.save{background:var(--gold);color:#08111f}
  .btn2.cancel{background:transparent;color:var(--gold-dim);border:1px solid var(--line)}
  .btn2.sold{background:var(--down);color:#fff}
  .btn2.ghost{background:transparent;color:var(--gold-dim);border:1px solid var(--line);font-weight:400;font-size:11px}
  .mineband{border-left:5px solid #38bdf8}
  .minepos{padding:13px 0;border-top:1px solid var(--line)}
  .minepos:first-of-type{border-top:none}
  .minepos p{margin:0 0 6px}
  .minepos .row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .minepos.alarm{background:rgba(220,38,38,0.1);border-radius:6px;padding:13px 12px;border:1px solid var(--down)}
  .showmore{width:100%;margin-top:10px}

  /* ---- watchlist ---- */
  .watchrow{display:grid;grid-template-columns:minmax(64px,auto) 1fr auto;gap:12px;align-items:baseline;
    padding:11px 0;border-top:1px solid var(--line)}
  .watchrow:first-of-type{border-top:none}
  .watchrow .wsym{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:700;color:#fff}
  .watchrow .wwhy{font-size:13px;color:var(--cream);line-height:1.55}
  .watchrow .wstat{font-size:11px;letter-spacing:.06em;text-transform:uppercase;text-align:right;white-space:nowrap}
  .wstat.qualified{color:var(--up)} .wstat.queued{color:var(--gold-bright)}
  .wstat.owned{color:var(--gold-dim)} .wstat.cooling{color:var(--gold-dim)}
  .watchnote{font-size:13px;color:var(--cream);line-height:1.6;margin-bottom:14px}
  .watchtags{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--gold-dim);margin-top:3px}
  .watchtags b{color:var(--ivory);font-weight:600}
  .watchgaps{display:flex;flex-wrap:wrap;gap:8px}
  .watchgaps span{font-size:13px;background:rgba(8,17,31,0.5);border:1px solid var(--line);
    border-radius:4px;padding:5px 10px;color:var(--cream)}

  /* ---- by the numbers ---- */
  .progrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-bottom:12px}
  .procell{background:rgba(8,17,31,0.5);border:1px solid var(--line);border-radius:6px;padding:10px 12px;cursor:help}
  .procell .k{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold-dim);margin-bottom:2px}
  .procell .v{font-size:19px;color:#fff;font-weight:600}

  /* ---- chart ---- */
  .chartwrap{position:relative;margin:14px 0 4px;background:rgba(8,17,31,0.5);border:1px solid var(--line);border-radius:6px;padding:10px}
  .chartwrap canvas{width:100%;height:230px;display:block}
  .ddwrap{margin-top:-2px;padding-top:4px;padding-bottom:4px}
  .ddwrap canvas{height:56px}
  .chart-tip{position:absolute;pointer-events:none;background:#162b52;border:1px solid var(--gold);color:var(--ivory);
    border-radius:6px;padding:8px 12px;font-size:12px;line-height:1.6;box-shadow:0 4px 16px rgba(0,0,0,0.5);
    display:none;white-space:nowrap;z-index:5}
  .chart-note{font-size:12px;color:var(--gold-dim);text-align:center}

  @media (max-width:640px){
    body{font-size:14px;padding:0 12px 50px}
    .ticker-bar{margin:0 -12px}
    .tabs{grid-template-columns:repeat(2,1fr)}
    .card{padding:18px 16px}
  }
</style>
</head>
<body data-palette="#c026d3,#ea580c,#16a34a,#0284c7">

<div class="ticker-bar">
  <div class="ticker-label"><span class="dot"></span>Live</div>
  <div class="ticker-track" id="tickerTrack"></div>
</div>

<h1>Jaren's Stock Market Adviser</h1>
<p class="statusline" id="statusline">Loading…</p>

<div class="tabs" id="tabs">
  <button class="tabbtn" data-tab="daytrade"><span class="icon">⚡</span><span class="name">Day Trader</span><span class="val" id="tabval-daytrade">…</span></button>
  <button class="tabbtn" data-tab="aggressive"><span class="icon">🚀</span><span class="name">Fast Mover</span><span class="val" id="tabval-aggressive">…</span></button>
  <button class="tabbtn" data-tab="growth"><span class="icon">📈</span><span class="name">Steady Climber</span><span class="val" id="tabval-growth">…</span></button>
  <button class="tabbtn" data-tab="longterm"><span class="icon">🏛️</span><span class="name">Nest Egg</span><span class="val" id="tabval-longterm">…</span></button>
</div>

<p class="combined" id="combined"></p>
<div id="staleWarn"></div>

<main id="content">
  <div class="card"><h2>One moment…</h2><p>Fetching the latest report from the machine.</p></div>
</main>


<script>
"use strict";
const FINNHUB_KEY = localStorage.getItem("jstm.apiKey") || "d874rh1r01ql0hsk9qogd874rh1r01ql0hsk9qp0";
const REPO_COMMITS = "https://github.com/jeells96/Stock-Market/commits/main";

const STRATS = {
  daytrade:{
    icon:"⚡", name:"Day Trader", accent:"#c026d3" },
  aggressive:{
    icon:"🚀", name:"Fast Mover", accent:"#ea580c" },
  growth:{
    icon:"📈", name:"Steady Climber", accent:"#16a34a" },
  longterm:{
    icon:"🏛️", name:"Nest Egg", accent:"#0284c7" },
};
const ORDER = ["daytrade","aggressive","growth","longterm"];
const START_CAP_FALLBACK = 10000;

let DATA = null;
let liveQuotes = {};
let currentTab = (location.hash || "").replace("#","");
if(!ORDER.includes(currentTab)) currentTab = "daytrade";

const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const money = v => (v==null||isNaN(v)) ? "—" : "$" + Math.round(v).toLocaleString("en-US");
const price = v => (v==null||isNaN(v)) ? "—" : "$" + Number(v).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});

function fmtDate(iso){
  if(!iso || iso.length !== 10) return iso || "—";
  return new Date(iso+"T12:00:00Z").toLocaleDateString("en-US",{month:"long",day:"numeric"});
}
function pctWords(p){
  if(p==null||isNaN(p)) return "even";
  if(Math.abs(p) < 0.005) return "unchanged";
  return `<span class="${p>=0?"up":"down"}">${p>=0?"up":"down"} ${Math.abs(p).toFixed(1)}%</span>`;
}
function marketStatus(){
  const et = new Date(new Date().toLocaleString("en-US",{timeZone:"America/New_York"}));
  const day = et.getDay(), mins = et.getHours()*60 + et.getMinutes();
  if(day===0||day===6) return "The market is closed for the weekend — next decisions Monday at 4 o'clock New York time.";
  if(mins < 9*60+30)   return "The market opens at 9:30 New York time this morning.";
  if(mins < 16*60)     return "The market is open right now — prices on this page refresh every minute.";
  return "The market has closed for today — the next decisions come at tomorrow's close.";
}

async function loadData(){
  try{
    const res = await fetch("data/site.json?t=" + Date.now(), {cache:"no-store"});
    if(!res.ok) throw new Error("HTTP " + res.status);
    DATA = await res.json();
  }catch(e){
    $("content").innerHTML = `<div class="card"><h2>Nothing to show yet</h2>
      <p>The machine hasn't published its first report. It updates by itself every market day —
      please check back after the next market close.</p></div>`;
    return false;
  }
  return true;
}

/* ---------- your own positions — stored in this browser only ---------- */
const MINE_KEY = "jsma.mine.v1";
let MINE = {positions: [], closed: []};
try { MINE = Object.assign(MINE, JSON.parse(localStorage.getItem(MINE_KEY) || "{}")); } catch(e){}
function saveMine(){ localStorage.setItem(MINE_KEY, JSON.stringify(MINE)); }
function mineFor(key){ return MINE.positions.filter(p => p.strategy === key); }
function mineOwns(key, sym){ return mineFor(key).some(p => p.symbol === sym); }
const RULE_DEFAULTS = {
  aggressive:{target_pct:0.20, stop_pct:0.08, max_hold_bars:15},
  growth:{target_pct:0.15, stop_pct:0.10},
  daytrade:{target_pct:0.03, stop_pct:0.02},
  longterm:{}
};
function ruleFor(key){
  return Object.assign({}, RULE_DEFAULTS[key] || {}, DATA?.strategies?.[key]?.rules || {});
}
function addMine(key, sym, px, amount){
  const r = ruleFor(key);
  const today = new Date().toISOString().slice(0,10);
  let deadline = null;
  if(key === "daytrade") deadline = today;
  else if(r.max_hold_bars) deadline = new Date(Date.now() + Math.round(r.max_hold_bars * 1.45) * 86400000).toISOString().slice(0,10);
  MINE.positions.push({
    id: Date.now() + "-" + sym, strategy: key, symbol: sym,
    entry_price: px, amount: amount, entry_date: today,
    target_price: r.target_pct ? +(px * (1 + r.target_pct)).toFixed(2) : null,
    stop_price: r.stop_pct ? +(px * (1 - r.stop_pct)).toFixed(2) : null,
    deadline
  });
  saveMine();
}
function closeMine(id, px){
  const i = MINE.positions.findIndex(p => p.id === id);
  if(i < 0) return;
  const p = MINE.positions.splice(i, 1)[0];
  MINE.closed.push({...p, exit_price: px, exit_date: new Date().toISOString().slice(0,10),
    pnl_pct: p.entry_price ? +((px / p.entry_price - 1) * 100).toFixed(2) : 0});
  saveMine();
}
function mineStatus(p){
  const px = liveQuotes[p.symbol];
  const today = new Date().toISOString().slice(0,10);
  if(px != null){
    if(p.stop_price && px <= p.stop_price) return {sell: true, why: `it has fallen to your protection point (${price(p.stop_price)})`};
    if(p.target_price && px >= p.target_price) return {sell: true, why: `it has reached your profit point (${price(p.target_price)})`};
  }
  if(p.deadline && today > p.deadline)
    return {sell: true, why: p.strategy === "daytrade" ? "day trades never stay overnight — sell before the close" : `its holding time is up (${fmtDate(p.deadline)})`};
  if(p.deadline && today === p.deadline){
    if(p.strategy === "daytrade"){
      // a day trade's deadline is TODAY by design — the alarm belongs near the
      // close, not the second it was bought
      const et = new Date(new Date().toLocaleString("en-US",{timeZone:"America/New_York"}));
      if(et.getHours()*60 + et.getMinutes() >= 15*60+30)
        return {sell: true, why: "day trades never stay overnight — sell before the close"};
    } else {
      return {sell: true, why: `its holding time is up (${fmtDate(p.deadline)})`};
    }
  }
  return {sell: false, why: ""};
}

/* ---------- one shared quote pump: your positions + board + ticker ---------- */
let quoteInfo = {};      // sym -> {px, chg, t}
let pumpSyms = [];       // high-priority rotation, rebuilt on each render
let pumpIdx = 0, tickIdx = 0, beat = 0, pumpStarted = false;
function rebuildPump(){
  const set = [];
  const push = s => { if(s && !set.includes(s)) set.push(s); };
  MINE.positions.forEach(p => push(p.symbol));
  ORDER.forEach(k => (DATA?.strategies[k]?.positions || []).forEach(p => push(p.symbol)));
  const b = DATA?.strategies?.[currentTab]?.board;
  if(b){
    const rows = b.rows || [];
    (currentTab === "daytrade" ? rows : rows.slice(0, 15)).forEach(r => push(r.symbol));
  }
  pumpSyms = set;
}
function noteQuote(sym, px, chg){
  quoteInfo[sym] = {px, chg, t: new Date()};
  liveQuotes[sym] = px;
}
function stampText(sym, fallback){
  const q = quoteInfo[sym];
  if(q) return "updated " + q.t.toLocaleTimeString("en-US", {hour:"numeric", minute:"2-digit"});
  if(!fallback) return "";
  const dpart = fallback.replace(" close", "");
  return "at the " + (dpart.length === 10 ? fmtDate(dpart) : dpart) + " close";
}
function applyLive(sym){
  const q = quoteInfo[sym];
  if(!q) return;
  document.querySelectorAll(`[data-live-px="${sym}"]`).forEach(el => { el.textContent = price(q.px); });
  document.querySelectorAll(`[data-live-stamp="${sym}"]`).forEach(el => {
    el.textContent = stampText(sym); el.classList.add("live");
  });
  document.querySelectorAll(`[data-live-gap="${sym}"]`).forEach(el => {
    const g = q.chg || 0;
    el.innerHTML = `<span class="${g >= 0 ? "up" : "down"}">${g >= 0 ? "+" : ""}${g.toFixed(2)}% today</span>` +
      (g >= 2 && g <= 8 ? ` <span class="chip cgap">gap zone</span>` : "");
  });
  document.querySelectorAll(`[data-live-mine="${sym}"]`).forEach(el => {
    const id = el.getAttribute("data-mine-id");
    const p = MINE.positions.find(x => x.id === id);
    if(!p || !p.entry_price) return;
    const pnl = (q.px / p.entry_price - 1) * 100;
    el.innerHTML = `<span class="${pnl>=0?"up":"down"}">${pnl>=0?"+":""}${pnl.toFixed(1)}%</span>` +
      `<small style="font-size:11px;color:var(--cream)"> now ${price(q.px)}</small>`;
  });
  renderTabs();
  refreshMineAlarms();
}
let mineAlarmState = "";
function refreshMineAlarms(){
  const alarms = mineFor(currentTab).map(p => ({p, st: mineStatus(p)})).filter(x => x.st.sell);
  const sig = alarms.map(x => x.p.id + x.st.why).join("|");
  if(sig === mineAlarmState) return;
  mineAlarmState = sig;
  if(alarms.length || document.getElementById("mineAlarmCard")) render();
}
async function quotePump(){
  if(pumpStarted) return;
  pumpStarted = true;
  while(true){
    beat++;
    let sym = null, forTicker = false;
    if(beat % 3 === 0 && TICKER_SYMS.length){ sym = TICKER_SYMS[tickIdx++ % TICKER_SYMS.length]; forTicker = true; }
    else if(pumpSyms.length){ sym = pumpSyms[pumpIdx++ % pumpSyms.length]; }
    else if(TICKER_SYMS.length){ sym = TICKER_SYMS[tickIdx++ % TICKER_SYMS.length]; forTicker = true; }
    if(sym){
      try{
        const r = await fetch(`https://finnhub.io/api/v1/quote?symbol=${encodeURIComponent(sym)}&token=${FINNHUB_KEY}`);
        const j = await r.json();
        if(j && j.c){
          noteQuote(sym, j.c, j.dp || 0);
          updateTickerItem(sym, j.c, j.dp || 0);
          if(!forTicker) applyLive(sym);
        }
      }catch(e){ /* keep last */ }
    }
    await new Promise(res => setTimeout(res, 1100));
  }
}

function livePrice(p){ return liveQuotes[p.symbol] || p.current_price; }
function liveEquity(key){
  const s = DATA.strategies[key];
  if(!s) return 0;
  return (s.cash||0) + (s.positions||[]).reduce((sum,p)=>sum+(p.shares||0)*livePrice(p),0);
}

/* ---------- rendering ---------- */
function renderTabs(){
  const startCap = DATA?.starting_capital || START_CAP_FALLBACK;
  // crown the current leader (only once someone is actually ahead)
  let best = null, bestEq = -Infinity, total = 0, n = 0;
  ORDER.forEach(k=>{
    if(!DATA?.strategies[k]) return;
    const eq = liveEquity(k);
    total += eq; n++;
    if(eq > bestEq){ bestEq = eq; best = k; }
  });
  const crowned = best && bestEq > startCap + 0.5 ? best : null;
  document.querySelectorAll(".tabbtn").forEach(btn=>{
    const key = btn.dataset.tab;
    btn.classList.toggle("active", key===currentTab);
    btn.querySelector(".leader")?.remove();
    if(key === crowned){
      const c = document.createElement("span");
      c.className = "leader"; c.textContent = "🏆";
      c.title = "Currently in the lead";
      btn.appendChild(c);
    }
    const el = $("tabval-"+key);
    if(el && DATA?.strategies[key]){
      const eq = liveEquity(key);
      const pct = startCap ? (eq/startCap-1)*100 : 0;
      const flat = Math.abs(pct) < 0.005;
      el.textContent = flat ? "0.0%" : `${pct>0?"+":""}${pct.toFixed(1)}%${pct>0?" ▲":" ▼"}`;
      el.style.color = flat ? "" : (pct>0 ? "var(--up)" : "var(--down)");
    }
  });
  if(n){
    const pctAll = (total/(n*startCap)-1)*100;
    $("combined").innerHTML = `All four together: ${pctWords(pctAll)}`;
  }
  // stale-feed warning: the machine reports every market day; silence means trouble
  const days = DATA ? Math.floor((Date.now() - new Date(DATA.as_of_date + "T21:00:00Z").getTime()) / 86400000) : 0;
  $("staleWarn").innerHTML = days > 4
    ? `<div class="stale"><b>Heads up:</b> the machine hasn't reported since ${fmtDate(DATA.as_of_date)} —
       that's longer than normal. The numbers below are from its last report.</div>`
    : "";
}

function todayCalls(key){
  const s = DATA.strategies[key], meta = STRATS[key];
  const items = [];
  // live alarms first — a stop or target crossed right now
  (s.positions||[]).forEach(p=>{
    const px = liveQuotes[p.symbol];
    if(!px) return;
    if(p.stop_price && px <= p.stop_price)
      items.push({kind:"alarm", html:`<b>Sell ${esc(p.symbol)} now.</b> The price is ${price(px)} — it has fallen to the
        protection point (${price(p.stop_price)}). If you own it, sell it. The official record will note the sale at today's closing price.`});
    else if(p.target_price && px >= p.target_price)
      items.push({kind:"alarm-good", html:`<b>Sell ${esc(p.symbol)} now and take the profit.</b> The price is ${price(px)} —
        it has reached the goal (${price(p.target_price)}).`});
  });
  (s.positions||[]).forEach(p=>{
    if(p.is_new) items.push({kind:"buy", html:`<b>Buy ${esc(p.name && p.name!==p.symbol ? p.name : p.symbol)} (${esc(p.symbol)})</b>
      near <b>${price(p.entry_price)}</b> a share. The machine bought it ${key==="daytrade"&&p.entry_time ? "today at "+esc(p.entry_time)+" New York time" : "at the "+fmtDate(p.entry_date)+" closing price"}.
      This page will tell you plainly when to sell it.`});
  });
  (s.recent_trades||[]).forEach(t=>{
    if(t.exit_date===DATA.as_of_date || (DATA.intraday_date && t.exit_date===DATA.intraday_date))
      items.push({kind:"sell", html:`<b>Sell ${esc(t.symbol)}</b> — the machine sold it at <b>${price(t.exit_price)}</b>
        (${esc(t.reason)}). Result: ${pctWords(t.pnl_pct)} on that stock.`});
  });
  return items;
}

    </div>`;
  } else {
    boardHtml = `<div class="card"><h2>The board</h2>
      <p>The full board publishes with the machine's next report (tonight after the close).</p></div>`;
  }

  // --- 2. why you should listen ---
  const wins = s.closed_trades
    ? `It has finished <b>${s.closed_trades}</b> trade${s.closed_trades===1?"":"s"} so far${
        s.win_rate_pct!=null ? `, and <b>${s.win_rate_pct.toFixed(0)}%</b> of them made money` : ""}.
       Its worst stretch was a dip of <b>${Math.abs(s.max_drawdown_pct||0).toFixed(1)}%</b>.`
    : `It hasn't finished a trade yet — its record starts building with the first sale.`;
  const eqPct = startCap ? (eq/startCap-1)*100 : 0;
  const proofHtml = `<div class="card"><h2>Why you should listen</h2>
    <p>Since <b>${fmtDate(DATA.inception_date)}</b> every decision has been published the instant
    it was made. If you had copied this strategy with any amount of money, you would now be:</p>
    <div class="bignum ${eqPct>=0?"up":"down"}">${eqPct>=0?"+":""}${eqPct.toFixed(2)}%</div>
    <p>The same money left in the overall market would be ${pctWords(bench.total_return_pct)}.
    ${wins}</p>
    <div class="chartwrap"><canvas id="chart"></canvas><div class="chart-tip" id="chartTip"></div></div>
    <div class="chartwrap ddwrap"><canvas id="ddChart"></canvas></div>
    <p class="chart-note">Percent gained or lost following this strategy (solid) versus the overall market (dashed), day by day.</p>
  </div>`;

  // --- 2b. by the numbers: institutional metrics, honestly nulled ---
  const pro = s.pro || {};
  const proCell = (label, v, suffix, tip) =>
    `<div class="procell" title="${tip}"><span class="k">${label}</span><span class="v">${v == null ? "&mdash;" : v + suffix}</span></div>`;
  const proHtml = `<div class="card"><h2>By the numbers</h2>
    <div class="progrid">
      ${proCell("Sharpe ratio", pro.sharpe, "", "Return earned per unit of risk taken. Above 1 is good; above 2 is excellent.")}
      ${proCell("Volatility (ann.)", pro.ann_vol_pct, "%", "How much the value swings in a typical year. Lower is calmer.")}
      ${proCell("Beta vs S&P 500", pro.beta, "", "How hard it moves when the market moves. 1 means with the market; 2 means twice as hard.")}
      ${proCell("Alpha (ann.)", pro.alpha_ann_pct, "%", "Return above what market exposure alone would explain. The skill number.")}
      ${proCell("Return (ann.)", pro.ann_return_pct, "%", "The yearly pace of growth. Only shown after 20+ trading days of history.")}
      ${proCell("Profit factor", pro.profit_factor, "", "Gross winnings divided by gross losses across finished trades. Above 1.5 is healthy. Needs 5+ trades.")}
      ${proCell("Sortino ratio", pro.sortino, "", "Like Sharpe, but only penalizes downside swings. Above 1.5 is strong.")}
      ${proCell("Calmar ratio", pro.calmar, "", "Annualized return divided by the worst dip. Above 1 means the pain was worth it.")}
      ${proCell("Worst dip", s.max_drawdown_pct != null ? Math.abs(s.max_drawdown_pct).toFixed(1) : null, "%", "Largest fall from a peak so far, using daily closing values.")}
      ${proCell("Underwater", pro.underwater_days, " days", "Longest stretch spent below a previous peak. Recovery speed matters as much as depth.")}
      ${proCell("Best day", pro.best_day_pct, "%", "Single best daily move so far.")}
      ${proCell("Worst day", pro.worst_day_pct, "%", "Single worst daily move so far.")}
      ${proCell("Turnover", pro.turnover_yr, "\u00d7/yr", "Roughly how many times a year each slot of money gets recycled into a new trade.")}
      ${proCell("Win rate", s.win_rate_pct != null ? s.win_rate_pct.toFixed(0) : null, "%", "Share of finished trades that made money.")}
    </div>
    <p class="smallnote">${(() => {
      const t = pro.t_stat, n = pro.sample_days || 0;
      if(n < 20) return `Statistical verdict: <b>far too early</b> \u2014 ${n} trading day${n===1?"":"s"} of history proves nothing either way.`;
      if(t == null || Math.abs(t) < 1) return `Statistical verdict: after ${n} trading days, results are <b>indistinguishable from luck</b> (t = ${t ?? "\u2014"}).`;
      if(Math.abs(t) < 2) return `Statistical verdict: after ${n} trading days there is <b>weak evidence</b> of ${t > 0 ? "skill" : "underperformance"} (t = ${t}) \u2014 not yet conclusive.`;
      return `Statistical verdict: after ${n} trading days the edge over the market is <b>statistically meaningful</b> (t = ${t}).`;
    })()}</p>
    <p class="smallnote">Results are NET of modeled slippage: 0.05% per fill (0.10% for day trades).
    Commissions are $0, matching modern retail brokers; the S&amp;P 500 benchmark is frictionless by convention.
    Pretend money. A dash means not enough history yet &mdash; these numbers have to be earned.
    Hover any figure for plain English.</p>
    <p class="smallnote">${(() => {
      const tu = DATA.tuning || {};
      let line = "\ud83d\udcd0 Self-tuning: every Sunday the machine re-examines its rules against all accumulated results and adapts them along fixed ladders \u2014 only with out-of-sample evidence, and every change is published.";
      if(tu.last_change) line += ` Last change (${fmtDate(tu.last_change.date)}): ${esc(tu.last_change.reason)}.`;
      else line += " No changes adopted yet \u2014 the loop gains power as history accumulates.";
      if(key === "daytrade" && (tu.benched||[]).length) line += ` Currently benched for repeated losses: ${tu.benched.join(", ")}.`;
      return line;
    })()}</p>
  </div>`;

  // --- 3. holdings ---
  const holds = (s.positions||[]).map(p=>{
    const nm = p.name && p.name!==p.symbol ? `${esc(p.name)} (${esc(p.symbol)})` : esc(p.symbol);
    const px = livePrice(p);
    const pnl = p.entry_price ? (px/p.entry_price-1)*100 : 0;
    let plan;
    if(key==="daytrade") plan = `It sells by itself at ${price(p.target_price)} (taking the profit), at ${price(p.stop_price)} (protecting the money), or at today's closing bell — whichever comes first.`;
    else if(p.target_price) plan = `The machine will say <b>sell</b> when the price ends a day above ${price(p.target_price)} (taking the profit) or below ${price(p.stop_price)} (protecting the money).`;
    else plan = `It is simply kept, and looks after itself.`;
    return `<div class="hold"><p>Holds <b>${nm}</b> — bought ${key==="daytrade"&&p.entry_time ? "today at "+esc(p.entry_time) : "on "+fmtDate(p.entry_date)}
      at ${price(p.entry_price)}, now ${price(px)}, ${pctWords(pnl)}. ${plan}</p></div>`;
  }).join("") || `<div class="hold"><p>Nothing at the moment — everything is safely in cash, waiting for
      the right opportunity. When it buys, the instruction appears under <b>“What to do today.”</b></p></div>`;
  const holdingsHtml = `<div class="card"><h2>What it's holding right now</h2>${holds}</div>`;

  // --- 4. recent decisions ---
  const trades = (s.recent_trades||[]).slice(0,5).map(t=>
    `<div class="trade">${fmtDate(t.exit_date)} — sold <b>${esc(t.symbol)}</b> at ${price(t.exit_price)}
     (bought ${fmtDate(t.entry_date)} at ${price(t.entry_price)}): ${pctWords(t.pnl_pct)} · ${esc(t.reason)}</div>`).join("");
  const tradesHtml = trades ? `<div class="card"><h2>Its last few decisions</h2>${trades}</div>` : "";

  // a re-render must never eat a half-filled buy/sell form: snapshot any open
  // form and its typed values, restore them after the rebuild
  const savedForms = {};
  document.querySelectorAll("#content .buyform").forEach(f => {
    if(f.id && f.style.display !== "none")
      savedForms[f.id] = Array.from(f.querySelectorAll("input")).map(inp => inp.value);
  });
  $("content").innerHTML = alarmHtml + mineHtml + boardHtml + todoHtml + proofHtml + proHtml + holdingsHtml + tradesHtml;
  Object.entries(savedForms).forEach(([id, vals]) => {
    const f = $(id);
    if(!f) return;
    f.style.display = "flex";
    Array.from(f.querySelectorAll("input")).forEach((inp, i) => { if(vals[i] != null) inp.value = vals[i]; });
  });
  wireBoardActions();
  rebuildPump();
  drawChart(key);
}

/* ---------- the chart: strategy line vs market reference, with hover ---------- */
let boardExpanded = false;
let openCards = new Set();
function wireBoardActions(){
  $("content").onclick = (ev) => {
    const btn = ev.target.closest("[data-act]");
    if(!btn){
      // a tap anywhere else on a board card opens its full reasoning
      if(ev.target.closest("input,label,a,button,.buyform")) return;
      const card = ev.target.closest(".bcard[data-card]");
      if(card){
        const form = card.querySelector(".buyform");
        if(form && form.style.display !== "none") return; // mid-entry — leave the card alone
        const cid = card.dataset.card;
        openCards.has(cid) ? openCards.delete(cid) : openCards.add(cid);
        render();
      }
      return;
    }
    const act = btn.dataset.act, sym = btn.dataset.sym, id = btn.dataset.id;
    if(act === "showmore"){ boardExpanded = true; render(); }
    else if(act === "buyform"){ const f = $("buyform-" + sym); if(f) f.style.display = "flex"; }
    else if(act === "buycancel"){ const f = $("buyform-" + sym); if(f) f.style.display = "none"; }
    else if(act === "buysave"){
      const px = parseFloat($("buypx-" + sym)?.value);
      const amt = parseFloat($("buyamt-" + sym)?.value) || 1000;
      if(!px || px <= 0) return;
      addMine(currentTab, sym, px, amt);
      render();
      window.scrollTo({top: 0, behavior: "smooth"});
    }
    else if(act === "sellform"){ const f = $("sellform-" + id); if(f) f.style.display = "flex"; }
    else if(act === "sellcancel"){ const f = $("sellform-" + id); if(f) f.style.display = "none"; }
    else if(act === "sellsave"){
      const px = parseFloat($("sellpx-" + id)?.value);
      if(!px || px <= 0) return;
      closeMine(id, px);
      render();
    }
    else if(act === "removemine"){
      const i = MINE.positions.findIndex(x => x.id === id);
      if(i >= 0){ MINE.positions.splice(i, 1); saveMine(); render(); }
    }
  };
}

function drawChart(key){
  const cv = $("chart");
  if(!cv || !DATA.equity_curves) return;
  const curves = DATA.equity_curves;
  const dates = curves.dates || [];
  const sSeries = curves[key] || [];
  const bSeries = curves.benchmark || [];
  const accent = STRATS[key].accent;
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth || 600, h = cv.clientHeight || 230;
  cv.width = w*dpr; cv.height = h*dpr;
  const ctx = cv.getContext("2d");
  ctx.scale(dpr,dpr);
  const base = DATA.starting_capital || START_CAP_FALLBACK;
  const pts = dates.map((d,i)=>({d, s:sSeries[i], b:bSeries[i]})).filter(p=>p.s!=null||p.b!=null);
  if(!pts.length){ ctx.font="13px 'JetBrains Mono',monospace"; ctx.fillStyle="rgba(201,169,97,0.7)"; ctx.fillText("The chart begins with the first market day.", 20, h/2); return; }
  pts.forEach(p=>{ p.sp = p.s!=null ? (p.s/base-1)*100 : null; p.bp = p.b!=null ? (p.b/base-1)*100 : null; });
  let lo=Infinity, hi=-Infinity;
  pts.forEach(p=>{ [p.sp,p.bp].forEach(v=>{ if(v!=null){ lo=Math.min(lo,v); hi=Math.max(hi,v);} }); });
  const pad = Math.max((hi-lo)*0.1, 0.15); lo-=pad; hi+=pad;
  const ML=64, MR=16, MT=12, MB=28;
  const X = i => pts.length>1 ? ML + i/(pts.length-1)*(w-ML-MR) : (ML+w-MR)/2;
  const Y = v => MT + (1-(v-lo)/(hi-lo))*(h-MT-MB);
  // recessive grid + percent labels
  ctx.font="11px 'JetBrains Mono',monospace"; ctx.fillStyle="rgba(201,169,97,0.7)"; ctx.strokeStyle="rgba(201,169,97,0.12)"; ctx.lineWidth=1;
  for(let g=0; g<=3; g++){
    const v = lo + (hi-lo)*g/3, y = Y(v);
    ctx.beginPath(); ctx.moveTo(ML,y); ctx.lineTo(w-MR,y); ctx.stroke();
    ctx.fillText((v>=0?"+":"")+v.toFixed(1)+"%", 6, y+4);
  }
  if(lo < 0 && hi > 0){ // the break-even line
    ctx.strokeStyle="rgba(201,169,97,0.3)";
    ctx.beginPath(); ctx.moveTo(ML,Y(0)); ctx.lineTo(w-MR,Y(0)); ctx.stroke();
    ctx.strokeStyle="rgba(201,169,97,0.12)";
  }
  const nT = Math.min(4, pts.length);
  for(let t=0;t<nT;t++){
    const i = nT===1?0:Math.round(t*(pts.length-1)/(nT-1));
    ctx.fillText(fmtDate(pts[i].d).replace("uary",".").slice(0,6), Math.min(X(i)-14, w-58), h-8);
  }
  // market: dashed gray reference line
  ctx.strokeStyle="#9aa0a8"; ctx.lineWidth=1.5; ctx.setLineDash([5,4]);
  ctx.beginPath(); let started=false;
  pts.forEach((p,i)=>{ if(p.bp==null) return; started?ctx.lineTo(X(i),Y(p.bp)):ctx.moveTo(X(i),Y(p.bp)); started=true; });
  ctx.stroke(); ctx.setLineDash([]);
  // strategy: solid accent line
  ctx.strokeStyle=accent; ctx.lineWidth=2.5;
  ctx.beginPath(); started=false; let lastI=-1;
  pts.forEach((p,i)=>{ if(p.sp==null) return; started?ctx.lineTo(X(i),Y(p.sp)):ctx.moveTo(X(i),Y(p.sp)); started=true; lastI=i; });
  ctx.stroke();
  if(lastI>=0){ ctx.beginPath(); ctx.arc(X(lastI),Y(pts[lastI].sp),4,0,Math.PI*2); ctx.fillStyle=accent; ctx.fill(); }
  // direct labels (identity is never color alone)
  ctx.font="bold 12px 'JetBrains Mono',monospace";
  if(lastI>=0){ ctx.fillStyle=accent; ctx.fillText("This strategy", Math.min(X(lastI)+8,w-92), Y(pts[lastI].sp)-8); }
  const lastB = [...pts].reverse().find(p=>p.bp!=null);
  if(lastB){ ctx.fillStyle="#6b7280"; ctx.fillText("The market", Math.min(X(pts.indexOf(lastB))+8,w-84), Y(lastB.bp)+16); }
  // hover crosshair + tooltip
  const tip = $("chartTip");
  cv.onmousemove = ev=>{
    const r = cv.getBoundingClientRect();
    const i = Math.max(0, Math.min(pts.length-1, Math.round((ev.clientX-r.left-ML)/((w-ML-MR)/Math.max(pts.length-1,1)))));
    const p = pts[i];
    tip.style.display="block";
    tip.style.left = Math.min(ev.clientX-r.left+14, r.width-170)+"px";
    tip.style.top  = "12px";
    const pf = v => v==null ? "—" : (v>=0?"+":"")+v.toFixed(2)+"%";
    tip.innerHTML = `<b>${fmtDate(p.d)}</b><br>This strategy: ${pf(p.sp)}<br>The market: ${pf(p.bp)}`;
  };
  cv.onmouseleave = ()=>{ tip.style.display="none"; };
  drawDrawdown(key, pts, ML, MR);
}

function drawDrawdown(key, pts, ML, MR){
  const cv = $("ddChart");
  if(!cv) return;
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth || 600, h = cv.clientHeight || 56;
  cv.width = w*dpr; cv.height = h*dpr;
  const ctx = cv.getContext("2d");
  ctx.scale(dpr,dpr);
  // running drawdown of the strategy series
  let peak = -Infinity;
  const dd = pts.map(p=>{
    if(p.s == null) return null;
    peak = Math.max(peak, p.s);
    return peak > 0 ? (p.s/peak - 1) * 100 : 0;
  });
  const worst = Math.min(-0.5, ...dd.filter(v=>v!=null));
  const X = i => pts.length>1 ? ML + i/(pts.length-1)*(w-ML-MR) : (ML+w-MR)/2;
  const Y = v => 6 + (v/worst) * (h-14);   // 0 at top, worst at bottom
  ctx.font="10px 'JetBrains Mono',monospace";
  ctx.fillStyle="rgba(201,169,97,0.6)";
  ctx.strokeStyle="rgba(201,169,97,0.12)";
  ctx.beginPath(); ctx.moveTo(ML, Y(0)); ctx.lineTo(w-MR, Y(0)); ctx.stroke();
  ctx.fillText("0%", 8, Y(0)+3);
  ctx.fillText(worst.toFixed(1)+"%", 8, h-4);
  ctx.beginPath();
  let started = false;
  dd.forEach((v,i)=>{
    if(v == null) return;
    const x = X(i), y = Y(v);
    if(!started){ ctx.moveTo(x, Y(0)); started = true; }
    ctx.lineTo(x, y);
  });
  if(started){
    ctx.lineTo(X(dd.length-1), Y(0));
    ctx.closePath();
    ctx.fillStyle = "rgba(248,113,113,0.35)";
    ctx.fill();
    ctx.strokeStyle = "#f87171";
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    let st2 = false;
    dd.forEach((v,i)=>{ if(v==null) return; st2 ? ctx.lineTo(X(i),Y(v)) : ctx.moveTo(X(i),Y(v)); st2 = true; });
    ctx.stroke();
  }
}


/* ---------- live ticker ---------- */
const TICKER_SYMS = ["AAPL","MSFT","NVDA","GOOGL","AMZN","META","TSLA","JPM","V","UNH","XOM","WMT","LLY","AVGO","JNJ","MA","PG","HD","COST","BAC","NFLX","KO","CRM","ORCL","AMD","DIS","SPY","QQQ","COIN","PLTR"];
let tickerBuilt = false;
function buildTicker(){
  // build the strip ONCE (two copies for the seamless -50% loop) and never
  // touch innerHTML again — rebuilding restarts the CSS animation and causes
  // the stutter. Prices update in place afterwards.
  const track = $("tickerTrack");
  track.innerHTML = [0, 1].map(copy => TICKER_SYMS.map(sym =>
    `<div class="ticker-item" data-sym="${sym}">
       <span class="ticker-sym">${sym}</span>
       <span class="ticker-px">&mdash;</span>
       <span class="ticker-chg"></span>
     </div>`).join("")).join("");
  // scroll speed proportional to content width so the pace is steady on any
  // screen (fixed 90s made it crawl or race depending on item count)
  requestAnimationFrame(() => {
    const half = track.scrollWidth / 2;
    if(half > 0) track.style.animationDuration = Math.max(30, Math.round(half / 55)) + "s";
  });
  tickerBuilt = true;
}
function updateTickerItem(sym, px, chg){
  document.querySelectorAll(`.ticker-item[data-sym="${sym}"]`).forEach(el => {
    el.querySelector(".ticker-px").textContent = "$" + px.toFixed(2);
    const up = (chg || 0) >= 0;
    const c = el.querySelector(".ticker-chg");
    c.className = "ticker-chg " + (up ? "up" : "down");
    c.textContent = `${up ? "\u25b2" : "\u25bc"} ${(chg >= 0 ? "+" : "")}${(chg || 0).toFixed(2)}%`;
  });
}

/* ---------- boot ---------- */
document.querySelectorAll(".tabbtn").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    currentTab = btn.dataset.tab;
    location.hash = currentTab;
    boardExpanded = false;
    mineAlarmState = "";
    renderTabs(); render();
    window.scrollTo({top:0, behavior:"smooth"});
  });
});
window.addEventListener("hashchange", ()=>{
  const k = location.hash.replace("#","");
  if(ORDER.includes(k) && k!==currentTab){ currentTab=k; renderTabs(); render(); }
});
window.addEventListener("resize", ()=>{ if(DATA) drawChart(currentTab); });
document.addEventListener("visibilitychange", async ()=>{
  if(document.visibilityState === "visible" && DATA){
    if(await loadData()){ renderTabs(); render(); }
  }
});

(async ()=>{
  if(await loadData()){
    renderTabs(); render();
    buildTicker();
    quotePump();
    setInterval(async ()=>{ if(await loadData()){ renderTabs(); render(); } }, 5*60000);
  }
})();
